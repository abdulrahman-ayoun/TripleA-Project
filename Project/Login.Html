<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="Login.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <form id="loginForm">
        <center><h1><b>Registration Form</b></h1></center>
        <input type="text" id="firstName" placeholder="Enter your First Name" required>
        <input type="text" id="lastName" placeholder="Enter your Last Name" required>
        <input type="text" id="location" placeholder="Enter your Location" required>
        <input type="email" id="email" placeholder="Enter your Email" required>
        <input type="number" id="phone" placeholder="Enter your Phone Number" required>
        <input type="password" id="password" placeholder="Enter your Password" required>
        
        <center>
            <button type="submit" class="login-btn">Login</button>
            <button type="button" class="cancel-btn" onclick="cancelForm()">Cancel</button>
        </center>
    </form>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Logged in successfully!');
            window.location.href = 'Project.html';
        });

        function cancelForm() {
            if(confirm('Are you sure you want to cancel?')) {
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
